<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia Pro - Completa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0b;color:#e8e0c9;font-family:Georgia,serif}
header{position:sticky;top:0;background:#111;border-bottom:1px solid #2a2a2a;padding:12px;z-index:10;text-align:center}
header h1{color:#f5d76e;font-size:18px}
.topbar{display:flex;gap:6px;justify-content:center;margin-top:8px}
.topbar button{padding:7px 12px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#e8e0c9;font-size:12px;cursor:pointer}
.topbar button.active{background:#f5d76e;color:#111;font-weight:800}
.buscar{display:flex;gap:8px;padding:12px;background:#111}
.buscar input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#1e1e1e;color:#fff}
.buscar button{padding:12px 16px;border-radius:10px;border:none;background:#f5d76e;font-weight:800}
select{width:100%;margin:6px 0;padding:11px;border-radius:10px;background:#1e1e1e;color:#e8e0c9;border:1px solid #333}
#libro{max-width:700px;margin:0 auto;padding:20px 18px 80px;background:#121210;min-height:100vh}
.titulo-libro{text-align:center;color:#f5d76e;font-size:22px;border-bottom:1px solid #333;padding-bottom:10px;margin-bottom:14px}
.cap-num{font-size:46px;float:left;line-height:.9;margin:6px 10px 2px 0;color:#f5d76e;font-weight:800}
.texto{font-size:18px;line-height:2;text-align:justify}
.vers{cursor:pointer;border-radius:6px;padding:1px 2px}
.vers:hover{background:#222}
.num{font-size:11px;color:#f5d76e;font-weight:800;vertical-align:super}
.resaltado{background:#4a3f15!important}
.nav{display:flex;gap:8px;margin-top:24px}
.nav button{flex:1;padding:13px;border-radius:99px;border:1px solid #f5d76e;background:transparent;color:#f5d76e;font-weight:800}
#panelFav{background:#111;border-top:1px solid #333;padding:14px;max-width:700px;margin:0 auto}
.fav-item{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:12px;margin-top:10px}
.fav-item small{color:#f5d76e}
#modal{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:2px solid #f5d76e;padding:16px;display:none;z-index:20}
#modal button{display:block;width:100%;margin-top:8px;padding:13px;border-radius:10px;border:none;background:#f5d76e;font-weight:800}
#modal button.sec{background:#333;color:#fff}
</style>
</head>
<body>
<header>
<h1>📖 BIBLIA PRO - RVR 1960</h1>
<div class="topbar">
<button id="btnLeer" class="active" onclick="mostrar('leer')">📖 Leer</button>
<button id="btnFav" onclick="mostrar('fav')">⭐ Favoritos (<span id="cantFav">0</span>)</button>
<button onclick="cambiarLetra(1)">A+</button>
<button onclick="cambiarLetra(-1)">A-</button>
<button onclick="verDelDia()">✨ Del Día</button>
</div>
</header>

<div class="buscar">
<input id="buscarInput" placeholder="Buscar: Juan 3:16">
<button onclick="buscar()">BUSCAR</button>
</div>
<div style="padding:0 12px;background:#111">
<select id="libroSel" onchange="cargarCaps()"></select>
<select id="capSel" onchange="cargarCap()"></select>
</div>

<div id="libro"><p style="text-align:center;color:#888;padding:30px">Cargando Biblia...</p></div>

<div id="panelFav" style="display:none">
<h2 style="color:#f5d76e">⭐ Mis Favoritos y Notas</h2>
<div id="listaFav"></div>
</div>

<div id="modal">
<h3 id="modalRef" style="color:#f5d76e"></h3>
<p id="modalTexto" style="margin-top:8px;font-size:15px;line-height:1.6"></p>
<button onclick="accionFav()">⭐ Guardar en Favoritos</button>
<button class="sec" onclick="accionResaltar()">🖍 Resaltar</button>
<button class="sec" onclick="accionNota()">📝 Agregar Nota</button>
<button class="sec" onclick="accionEscuchar()">🔊 Escuchar</button>
<button class="sec" onclick="accionCompartir()">💬 Compartir</button>
<button class="sec" style="background:#a00;color:#fff" onclick="cerrarModal()">Cerrar</button>
</div>

<script>
const LIBROS = [
["Génesis","GEN",50],["Éxodo","EXO",40],["Levítico","LEV",27],["Números","NUM",36],["Deuteronomio","DEU",34],
["Josué","JOS",24],["Jueces","JDG",21],["Rut","RUT",4],["1 Samuel","1SA",31],["2 Samuel","2SA",24],
["1 Reyes","1KI",22],["2 Reyes","2KI",25],["1 Crónicas","1CH",29],["2 Crónicas","2CH",36],["Esdras","EZR",10],
["Nehemías","NEH",13],["Ester","EST",10],["Job","JOB",42],["Salmos","PSA",150],["Proverbios","PRO",31],
["Eclesiastés","ECC",12],["Cantares","SNG",8],["Isaías","ISA",66],["Jeremías","JER",52],["Lamentaciones","LAM",5],
["Ezequiel","EZK",48],["Daniel","DAN",12],["Oseas","HOS",14],["Joel","JOL",3],["Amós","AMO",9],
["Abdías","OBA",1],["Jonás","JON",4],["Miqueas","MIC",7],["Nahum","NAM",3],["Habacuc","HAB",3],
["Sofonías","ZEP",3],["Hageo","HAG",2],["Zacarías","ZEC",14],["Malaquías","MAL",4],["Mateo","MAT",28],
["Marcos","MRK",16],["Lucas","LUK",24],["Juan","JHN",21],["Hechos","ACT",28],["Romanos","ROM",16],
["1 Corintios","1CO",16],["2 Corintios","2CO",13],["Gálatas","GAL",6],["Efesios","EPH",6],["Filipenses","PHP",4],
["Colosenses","COL",4],["1 Tesalonicenses","1TH",5],["2 Tesalonicenses","2TH",3],["1 Timoteo","1TI",6],
["2 Timoteo","2TI",4],["Tito","TIT",3],["Filemón","PHM",1],["Hebreos","HEB",13],["Santiago","JAS",5],
["1 Pedro","1PE",5],["2 Pedro","2PE",5],["1 Juan","1JN",5],["2 Juan","2JN",1],["3 Juan","3JN",1],
["Judas","JUD",1],["Apocalipsis","REV",22]
];
let libroSel=document.getElementById('libroSel'), capSel=document.getElementById('capSel');
let favs=JSON.parse(localStorage.getItem('favPro')||'[]');
let resaltados=new Set(JSON.parse(localStorage.getItem('resPro')||'[]'));
let notas=JSON.parse(localStorage.getItem('notasPro')||'{}');
let seleccionado=null;
let tamLetra=18;

LIBROS.forEach((l,i)=>{let o=document.createElement('option');o.value=i;o.textContent=l[0];libroSel.appendChild(o)});
cargarCaps(); actualizarCantFav();

function cargarCaps(){
  let total=LIBROS[libroSel.value][2];
  capSel.innerHTML='';
  for(let c=1;c<=total;c++){let o=document.createElement('option');o.value=c;o.textContent='Capítulo '+c;capSel.appendChild(o)}
  cargarCap();
}
async function cargarCap(){
  let idx=+libroSel.value, cap=+capSel.value;
  let [nombre,codigo]=[LIBROS[idx][0],LIBROS[idx][1]];
  let cont=document.getElementById('libro');
  cont.innerHTML='<p style="text-align:center;color:#888;padding:20px">Abriendo '+nombre+' '+cap+'...</p>';
  try{
    let r=await fetch(`https://bolls.life/get-text/${codigo}/${cap}/?translation=rvr1960`);
    let data=await r.json();
    let html=`<div class="titulo-libro">${nombre} ${cap}</div><div class="texto" style="font-size:${tamLetra}px"><span class="cap-num">${cap}</span>`;
    data.forEach(v=>{
      let ref=`${nombre} ${cap}:${v.verse}`;
      let txt=v.text?v.text.replace(/<[^>]*>/g,''):'';
      let isRes=resaltados.has(ref)?' resaltado':'';
      html+=`<span class="vers${isRes}" data-ref="${ref}" data-texto="${txt.replace(/"/g,"'")}" onclick="abrirModal(this)"><span class="num">${v.verse}</span> ${txt} </span>`;
    });
    html+=`</div><div class="nav"><button onclick="cambiarCap(-1)">← Anterior</button><button onclick="leerCapitulo()">🔊 Escuchar</button><button onclick="cambiarCap(1)">Siguiente →</button></div>`;
    cont.innerHTML=html;
  }catch(e){cont.innerHTML='<p style="text-align:center;color:#888;padding:20px">Error de internet</p>'}
function cambiarCap(d){
  let idx=+libroSel.value, cap=+capSel.value, total=LIBROS[idx][2];
  let nuevo=cap+d;
  if(nuevo<1){ if(idx>0){libroSel.value=idx-1;cargarCaps();capSel.value=LIBROS[idx-1][2];} return; }
  if(nuevo>total){ if(idx<LIBROS.length-1){libroSel.value=idx+1;cargarCaps();capSel.value=1;} return; }
  capSel.value=nuevo; cargarCap();
}
function abrirModal(el){
  seleccionado={ref:el.dataset.ref, texto:el.dataset.texto};
  document.getElementById('modalRef').textContent=seleccionado.ref;
  document.getElementById('modalTexto').textContent='"'+seleccionado.texto+'"';
  document.getElementById('modal').style.display='block';
}
function cerrarModal(){document.getElementById('modal').style.display='none'}
function accionFav(){
  if(!favs.find(f=>f.ref===seleccionado.ref)){favs.push({...seleccionado, nota:notas[seleccionado.ref]||''});localStorage.setItem('favPro',JSON.stringify(favs));actualizarCantFav();alert('Guardado en favoritos');}
  cerrarModal();
}
function accionResaltar(){
  if(resaltados.has(seleccionado.ref)) resaltados.delete(seleccionado.ref); else resaltados.add(seleccionado.ref);
  localStorage.setItem('resPro',JSON.stringify([...resaltados]));
  cargarCap(); cerrarModal();
}
function accionNota(){
  let n=prompt('Tu nota para '+seleccionado.ref, notas[seleccionado.ref]||'');
  if(n!==null){notas[seleccionado.ref]=n;localStorage.setItem('notasPro',JSON.stringify(notas));}
  cerrarModal();
}
function accionEscuchar(){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(seleccionado.ref+'. '+seleccionado.texto); u.lang='es-AR'; u.rate=0.85; u.pitch=0.9; speechSynthesis.speak(u);
  cerrarModal();
}
function accionCompartir(){
  window.open('https://wa.me/?text='+encodeURIComponent(seleccionado.ref+': '+seleccionado.texto),'_blank'); cerrarModal();
}
function actualizarCantFav(){document.getElementById('cantFav').textContent=favs.length}
function mostrar(v){
  document.getElementById('btnLeer').classList.toggle('active',v==='leer');
  document.getElementById('btnFav').classList.toggle('active',v==='fav');
  document.getElementById('libro').style.display=v==='leer'?'block':'none';
  document.getElementById('panelFav').style.display=v==='fav'?'block':'none';
  if(v==='fav') renderFav();
}
function renderFav(){
  let c=document.getElementById('listaFav');
  if(favs.length===0){c.innerHTML='<p style="color:#888;margin-top:10px">No tenés favoritos. Tocá un versículo y guardalo.</p>';return}
  c.innerHTML=favs.map((f,i)=>`<div class="fav-item"><small>${f.ref}</small><p>"${f.texto}"</p>${f.nota?`<p style="color:#f5d76e;font-size:13px;margin-top:6px">📝 ${f.nota}</p>`:''}<button style="margin-top:8px;padding:8px 12px;border-radius:8px;border:none;background:#a00;color:#fff" onclick="borrarFav(${i})">Borrar</button></div>`).join('');
}
function borrarFav(i){favs.splice(i,1);localStorage.setItem('favPro',JSON.stringify(favs));actualizarCantFav();renderFav()}
function cambiarLetra(d){tamLetra=Math.min(24,Math.max(14,tamLetra+d));cargarCap()}
async function buscar(){
  let raw=document.getElementById('buscarInput').value.trim(); if(!raw) return;
  let m=raw.match(/(.+?)\s*(\d+):(\d+)/); if(!m){alert('Usá formato: Juan 3:16');return}
  let libroTxt=m[1].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  let idx=LIBROS.findIndex(l=>l[0].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(libroTxt));
  if(idx<0){alert('Libro no encontrado');return}
  libroSel.value=idx; cargarCaps(); capSel.value=m[2]; await cargarCap();
  setTimeout(()=>{document.querySelectorAll('.num').forEach(n=>{if(n.textContent===m[3]){n.parentElement.style.background='#3a3320';n.parentElement.scrollIntoView({behavior:'smooth',block:'center'})}})},700);
}
function verDelDia(){
  let opciones=["Juan 3:16|Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.","Salmos 23:1|Jehová es mi pastor; nada me faltará.","Filipenses 4:13|Todo lo puedo en Cristo que me fortalece.","Proverbios 3:5|Fíate de Jehová de todo tu corazón, y no te apoyes en tu propia prudencia."];
  let e=opciones[new Date().getDate()%opciones.length].split('|');
  alert('✨ Versículo del día\n'+e[0]+'\n"'+e[1]+'"');
}
function leerCapitulo(){
  let t=document.getElementById('libro').innerText;
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t); u.lang='es-AR'; u.rate=0.9; u.pitch=0.9; speechSynthesis.speak(u);
}
</script>
</body>
  </html>
