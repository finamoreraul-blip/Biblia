<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia PRO MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0b;color:#e8e0c9;font-family:Georgia,serif}
header{position:sticky;top:0;background:#111;border-bottom:1px solid #2a2a2a;padding:12px;z-index:10;text-align:center}
header h1{color:#f5d76e;font-size:19px}
.menu{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.menu button{padding:9px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:13px;cursor:pointer}
.menu button.active{background:#f5d76e;color:#111;font-weight:800}
.seccion{display:none;max-width:720px;margin:0 auto;padding:14px}
.seccion.activa{display:block}
#descargaBox{background:#1c1c1c;border:1px solid #f5d76e;border-radius:14px;padding:14px;margin-bottom:12px;text-align:center}
#descargaBox button{width:100%;padding:14px;border-radius:99px;border:none;background:#f5d76e;font-weight:800;cursor:pointer;margin-top:8px}
#barra{width:100%;background:#333;border-radius:99px;height:12px;margin-top:10px;overflow:hidden}
#barraLlena{height:100%;width:0%;background:#f5d76e}
#libro{background:#121210;border-radius:16px;padding:18px;min-height:60vh}
.titulo-libro{text-align:center;color:#f5d76e;font-size:22px;border-bottom:1px solid #333;padding-bottom:10px;margin-bottom:12px}
.cap-num{font-size:46px;float:left;line-height:.9;margin:6px 10px 2px 0;color:#f5d76e;font-weight:800}
.texto{font-size:18px;line-height:2;text-align:justify}
.vers{cursor:pointer;border-radius:6px;padding:2px}
.vers:hover{background:#222}
.num{font-size:11px;color:#f5d76e;font-weight:800;vertical-align:super}
.resaltado{background:#4a3f15}
.nav{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.nav button{flex:1;min-width:120px;padding:13px;border-radius:99px;border:1px solid #f5d76e;background:transparent;color:#f5d76e;font-weight:800;cursor:pointer}
input,textarea,select{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#1e1e1e;color:#fff;margin-top:8px;font-size:15px}
button.grande{width:100%;margin-top:10px;padding:14px;border-radius:10px;border:none;background:#f5d76e;color:#111;font-weight:800;cursor:pointer}
.card{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:14px;margin-top:12px}
.card small{color:#f5d76e;font-weight:800}
.card p{margin-top:6px;line-height:1.6}
.card button{margin-top:8px;padding:10px;border-radius:99px;border:none;background:#f5d76e;font-weight:700;width:100%;cursor:pointer}
.chat{max-height:320px;overflow-y:auto;background:#111;border-radius:12px;padding:10px;margin-top:10px;border:1px solid #333}
.msg{padding:10px;border-radius:12px;margin-bottom:8px;line-height:1.5}
.msg.user{background:#2a2a2a;text-align:right}
.msg.ia{background:#3a3320;border-left:3px solid #f5d76e}
#modal{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:2px solid #f5d76e;padding:16px;display:none;z-index:20;max-width:720px;margin:0 auto}
#modal button{display:block;width:100%;margin-top:8px;padding:12px;border-radius:10px;border:none;background:#f5d76e;font-weight:800;cursor:pointer}
#modal button.sec{background:#333;color:#fff}
audio{width:100%;margin-top:12px}
</style>
</head>
<body>
<header>
<h1>📖 BIBLIA PRO MAX</h1>
<div class="menu">
<button class="active" onclick="mostrar('leer')">📖 Leer</button>
<button onclick="mostrar('ia')">🤖 IA</button>
<button onclick="mostrar('fav')">⭐ Favoritos</button>
</div>
</header>

<div id="sec-leer" class="seccion activa">
<div id="descargaBox">
<b id="estadoDescarga">📥 Descargar TODA la Biblia de una vez (1 archivo, ~10 seg)</b>
<p style="font-size:13px;margin-top:6px;color:#ccc">Después anda sin internet. Sin clave.</p>
<button onclick="descargarBiblia()">DESCARGAR BIBLIA COMPLETA</button>
<div id="barra"><div id="barraLlena"></div></div>
<small id="progreso"></small>
</div>

<input id="buscarInput" placeholder="Buscar cita: Juan 3:16">
<button class="grande" onclick="buscarCita()">🔍 BUSCAR CITA</button>
<input id="buscarPalabra" placeholder="Buscar palabra en toda la Biblia: paz, amor...">
<button class="grande" style="background:#333;color:#f5d76e" onclick="buscarPalabra()">BUSCAR PALABRA</button>

<select id="libroSel" onchange="cargarCap()"></select>
<select id="capSel" onchange="cargarCap()"></select>
<div id="libro" style="margin-top:12px"><p style="text-align:center;color:#888;padding:20px">Tocá DESCARGAR BIBLIA COMPLETA</p></div>
</div>

<div id="sec-ia" class="seccion">
<div class="card">
<small>🤖 IA CONTEXTUAL - Busca en tu Biblia descargada</small>
<div id="chatIA" class="chat"><div class="msg ia">Hola, contame cómo estás. Te busco versículos de verdad.</div></div>
<textarea id="consultaIA" rows="2" placeholder="Ej: no duermo, tengo miedo..."></textarea>
<button class="grande" onclick="pedirIA()">ENVIAR</button>
<button class="grande" style="background:#333;color:#fff" onclick="limpiarChat()">Limpiar chat</button>
</div>
</div>

<div id="sec-fav" class="seccion">
<h2 style="color:#f5d76e;margin-bottom:10px">⭐ Mis Favoritos</h2>
<div id="listaFav"></div>
</div>

<div id="modal">
<h3 id="modalRef" style="color:#f5d76e"></h3>
<p id="modalTexto" style="margin-top:8px;line-height:1.6"></p>
<button onclick="accionFav()">⭐ Guardar en Favoritos</button>
<button class="sec" onclick="accionResaltar()">🖍 Resaltar</button>
<button class="sec" onclick="accionEscuchar()">🔊 Escuchar</button>
<button class="sec" onclick="accionCompartir()">💬 Compartir</button>
<button class="sec" style="background:#a00;color:#fff" onclick="cerrarModal()">Cerrar</button>
</div>

<script>
let estructuraLibros=[]; // [{nombre, caps:[1..150]}]
let todosLosVersiculos=[]; // [{book, chapter, verse, texto, ref}]
let currentVerses=[], seleccionado=null, tamLetra=18;
let favs=JSON.parse(localStorage.getItem('favMax')||'[]');
let resaltados=new Set(JSON.parse(localStorage.getItem('resMax')||'[]'));
let historial=JSON.parse(localStorage.getItem('chatMax')||'[]');

let libroSel=document.getElementById('libroSel'), capSel=document.getElementById('capSel');
libroSel.addEventListener('change',cargarCaps);
capSel.addEventListener('change',cargarCap);
document.getElementById('libro').addEventListener('click',e=>{
  let el=e.target.closest('.vers');
  if(el) abrirModal(+el.dataset.i);
});

function mostrar(v){
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.seccion').forEach(s=>s.classList.remove('activa'));
  document.getElementById('sec-'+v).classList.add('activa');
  if(v==='fav') renderFav();
}

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('bibliaMaxDB',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('verses',{keyPath:'id'})};r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej()})}
async function guardarLote(lote){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('verses','readwrite');const st=tx.objectStore('verses');lote.forEach(v=>st.put(v));tx.oncomplete=res;tx.onerror=()=>rej()})}
async function borrarDB(){const db=await openDB();return new Promise(res=>{const tx=db.transaction('verses','readwrite');tx.objectStore('verses').clear();tx.oncomplete=res})}

// LIMPIAR TEXTO
function limpiar(t){return (t||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()}

function normalizarLibros(json){
  let raw = json.books || json.data?.books || json.data || json;
  if(!Array.isArray(raw)) raw = Object.values(raw);
  let libros=[];
  for(let b of raw){
    let nombre = b.book_name || b.name || b.title || b.book || 'Libro';
    let capsRaw = b.chapters || b.chapter || [];
    let caps=[];
    for(let c of capsRaw){
      let numCap = c.chapter_id || c.chapter || c.num || (caps.length+1);
      let items = c.items || c.verses || [];
      let vers=[];
      if(Array.isArray(items)){
        for(let it of items){
          if(typeof it==='string'){ vers.push({verse:vers.length+1, texto:limpiar(it)}); }
          else if(it.lines){ vers.push({verse:parseInt(it.verse_number||it.verse_numbers||vers.length+1), texto:limpiar(it.lines.join(' '))}); }
          else if(it.text){ vers.push({verse:parseInt(it.verse_number||it.verse||vers.length+1), texto:limpiar(it.text)}); }
        }
      }
      if(vers.length>0) caps.push({cap:parseInt(numCap), verses:vers});
    }
    if(caps.length>0) libros.push({nombre, caps});
  }
  return libros;
}

// DESCARGA ÚNICA Y RÁPIDA
async function descargarBiblia(){
  let barra=document.getElementById('barraLlena'), prog=document.getElementById('progreso');
  prog.textContent='Descargando archivo completo...';
  barra.style.width='10%';
  try{
    let url='https://mrk214.github.io/snapshots/es___spa___spa/RVR1960_vid_149.json';
    let resp=await fetch(url);
    if(!resp.ok) throw new Error('no bajo');
    prog.textContent='Procesando Biblia...';
    barra.style.width='60%';
    let json=await resp.json();
    estructuraLibros=normalizarLibros(json);
    if(estructuraLibros.length===0) throw new Error('formato');

    await borrarDB();
    todosLosVersiculos=[];
    let lote=[];
    let total=0;
    estructuraLibros.forEach(l=>l.caps.forEach(c=>total+=c.verses.length));
    let hechos=0;
    for(let lib of estructuraLibros){
      for(let cap of lib.caps){
        for(let v of cap.verses){
          let ref=`${lib.nombre} ${cap.cap}:${v.verse}`;
          let obj={id:ref, book:lib.nombre, chapter:cap.cap, verse:v.verse, texto:v.texto, ref};
          lote.push(obj); todosLosVersiculos.push(obj);
          hechos++;
          if(lote.length>=500){ await guardarLote(lote); lote=[]; }
        }
      }
      barra.style.width=Math.round(hechos/total*100)+'%';
      prog.textContent=`Guardando ${lib.nombre}... ${Math.round(hechos/total*100)}%`;
    }
    if(lote.length) await guardarLote(lote);
    localStorage.setItem('bibliaMaxOK','1');
    prog.textContent='✅ LISTO! Biblia completa guardada. Ya funciona sin internet.';
    barra.style.width='100%';
    document.getElementById('estadoDescarga').textContent='✅ Biblia completa descargada';
    llenarSelectores(); cargarCap();
  }catch(e){
    prog.textContent='❌ Error al descargar. Tocá de nuevo. Revisá internet.';
    console.error(e);
  }
}

async function cargarDesdeDB(){
  try{
    const db=await openDB();
    let req=db.transaction('verses','readonly').objectStore('verses').getAll();
    let data=await new Promise(res=>{req.onsuccess=()=>res(req.result)});
    if(data && data.length>1000){
      todosLosVersiculos=data;
      // reconstruir estructura
      let mapa={};
      data.forEach(v=>{ if(!mapa[v.book]) mapa[v.book]={nombre:v.book, capsSet:new Set()}; mapa[v.book].capsSet.add(v.chapter); });
      estructuraLibros=Object.values(mapa).map(m=>({nombre:m.nombre, caps:[...m.capsSet].sort((a,b)=>a-b).map(c=>({cap:c}))}));
      llenarSelectores();
      document.getElementById('estadoDescarga').textContent='✅ Biblia cargada desde tu celular';
      await cargarCap();
    }
  }catch(e){}
}
cargarDesdeDB();

function llenarSelectores(){
  libroSel.innerHTML=''; capSel.innerHTML='';
  estructuraLibros.forEach((l,i)=>{
    let o=document.createElement('option'); o.value=i; o.textContent=l.nombre; libroSel.appendChild(o);
  });
  cargarCaps();
}
function cargarCaps(){
  let idx=+libroSel.value;
  if(!estructuraLibros[idx]) return;
  capSel.innerHTML='';
  estructuraLibros[idx].caps.forEach(c=>{
    let o=document.createElement('option'); o.value=c.cap; o.textContent='Capítulo '+c.cap; capSel.appendChild(o);
  });
  cargarCap();
}
async function cargarCap(){
  if(todosLosVersiculos.length===0){
    document.getElementById('libro').innerHTML='<p style="text-align:center;color:#f5d76e;padding:20px">Tocá DESCARGAR BIBLIA COMPLETA arriba.</p>';return;
  }
  let idx=+libroSel.value; let nombre=estructuraLibros[idx].nombre;
  let cap=+capSel.value;
  let vers=todosLosVersiculos.filter(v=>v.book===nombre && v.chapter===cap).sort((a,b)=>a.verse-b.verse);
  currentVerses=vers;
  let html=`<div class="titulo-libro">${nombre} ${cap}</div><div class="texto" style="font-size:${tamLetra}px"><span class="cap-num">${cap}</span>`;
  vers.forEach((v,i)=>{
    let isRes=resaltados.has(v.ref)?' resaltado':'';
    html+=`<span class="vers${isRes}" data-i="${i}"><span class="num">${v.verse}</span> ${v.texto} </span>`;
  });
  html+=`</div><div class="nav"><button onclick="cambiarCap(-1)">← Anterior</button><button onclick="leerVoz()">🔊 Escuchar</button><button onclick="cambiarCap(1)">Siguiente →</button></div>`;
  document.getElementById('libro').innerHTML=html;
}
function cambiarCap(d){
  let idx=+libroSel.value;
  let caps=estructuraLibros[idx].caps.map(c=>c.cap);
  let pos=caps.indexOf(+capSel.value);
  let nuevoPos=pos+d;
  if(nuevoPos<0){ if(idx>0){libroSel.value=idx-1;cargarCaps();capSel.value=estructuraLibros[idx-1].caps.slice(-1)[0].cap;} return; }
  if(nuevoPos>=caps.length){ if(idx<estructuraLibros.length-1){libroSel.value=idx+1;cargarCaps();capSel.value=estructuraLibros[idx+1].caps[0].cap;} return; }
  capSel.value=caps[nuevoPos]; cargarCap();
}
function buscarCita(){
  let raw=document.getElementById('buscarInput').value.trim(); if(!raw) return;
  let m=raw.match(/(.+?)\s*(\d+):(\d+)/); if(!m){alert('Formato: Juan 3:16');return}
  let libroTxt=m[1].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  let idx=estructuraLibros.findIndex(l=>l.nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(libroTxt));
  if(idx<0){alert('Libro no encontrado');return}
  libroSel.value=idx; cargarCaps(); capSel.value=m[2]; cargarCap();
  setTimeout(()=>{document.querySelectorAll('.num').forEach(n=>{if(n.textContent===m[3]){n.parentElement.style.background='#3a3320';n.parentElement.scrollIntoView({behavior:'smooth',block:'center'})}})},700);
}
function buscarPalabra(){
  let palabra=document.getElementById('buscarPalabra').value.trim().toLowerCase();
  if(!palabra) return;
  let res=todosLosVersiculos.filter(v=>v.texto.toLowerCase().includes(palabra)).slice(0,20);
  let html=`<div class="titulo-libro">Resultados para "${palabra}" (${res.length})</div>`;
  res.forEach(v=>{html+=`<div class="card"><small>${v.ref}</small><p>"${v.texto}"</p><button onclick="hablarSuave('${v.texto.replace(/'/g,"")}','${v.ref}')">🔊 Escuchar</button></div>`});
  document.getElementById('libro').innerHTML=html;
}

function abrirModal(i){
  seleccionado=currentVerses[i];
  document.getElementById('modalRef').textContent=seleccionado.ref;
  document.getElementById('modalTexto').textContent='"'+seleccionado.texto+'"';
  document.getElementById('modal').style.display='block';
}
function cerrarModal(){document.getElementById('modal').style.display='none'}
function accionFav(){if(!favs.find(f=>f.ref===seleccionado.ref)){favs.push(seleccionado);localStorage.setItem('favMax',JSON.stringify(favs));alert('⭐ Guardado')}cerrarModal()}
function accionResaltar(){if(resaltados.has(seleccionado.ref))resaltados.delete(seleccionado.ref);else resaltados.add(seleccionado.ref);localStorage.setItem('resMax',JSON.stringify([...resaltados]));cargarCap();cerrarModal()}
function accionEscuchar(){hablarSuave(seleccionado.texto,seleccionado.ref);cerrarModal()}
function accionCompartir(){window.open('https://wa.me/?text='+encodeURIComponent(seleccionado.ref+': '+seleccionado.texto),'_blank');cerrarModal()}
function hablarSuave(texto,ref){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(ref+'. '+texto);u.lang='es-AR';u.rate=0.85;u.pitch=0.9;speechSynthesis.speak(u)}
function leerVoz(){hablarSuave(document.getElementById('libro').innerText,'Capítulo')}
function renderFav(){
  let c=document.getElementById('listaFav');
  if(favs.length===0){c.innerHTML='<p style="color:#888">No tenés favoritos.</p>';return}
  c.innerHTML=favs.map((f,i)=>`<div class="card"><small>${f.ref}</small><p>"${f.texto}"</p><button onclick="borrarFav(${i})" style="background:#a00;color:#fff">Borrar</button></div>`).join('');
}
function borrarFav(i){favs.splice(i,1);localStorage.setItem('favMax',JSON.stringify(favs));renderFav()}

// --- IA CONTEXTUAL QUE SIEMPRE MANDA VERSICULOS ---
const TEMAS = {
  economia: {p:['plata','econom','deuda','trabajo','sueldo','pobre','falta','proveer','desempleo'], vers:['Filipenses 4:19','Mateo 6:33','Proverbios 3:9']},
  ansiedad: {p:['ansied','nervio','preocup','estres','angust','miedo','temor','panico','inquiet'], vers:['Filipenses 4:6','1 Pedro 5:7','Isaías 41:10']},
  tristeza: {p:['triste','llanto','dolor','depre','solo','abandon','llorar','quebrant'], vers:['Salmos 34:18','Salmos 42:11','Isaías 61:3']},
  familia: {p:['familia','hijo','esposa','marido','padre','madre','hermano','casa','matrimonio'], vers:['Josué 24:15','Salmos 133:1','Proverbios 22:6']},
  salud: {p:['enferm','salud','cuerpo','cancer','operacion','curar','sanar'], vers:['Isaías 53:5','Santiago 5:14','Salmos 41:3']},
  perdon: {p:['perdon','culpa','pecado','fallé','arrepent'], vers:['1 Juan 1:9','Salmos 51:10','Isaías 1:18']},
  esperanza: {p:['esperanza','futuro','plan','proposito'], vers:['Jeremías 29:11','Romanos 8:28','Proverbios 3:5']},
  amor: {p:['amor','soledad','pareja','novia','novio'], vers:['Juan 3:16','1 Corintios 13:4','Romanos 8:38']}
};

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function detectarTemas(texto){
  let t=norm(texto);
  let encontrados=[];
  for(let k in TEMAS){
    let score=0;
    TEMAS[k].p.forEach(p=>{if(t.includes(p)) score+=2});
    if(score>0) encontrados.push({tema:k,score});
  }
  // CONTEXTO: mira lo anterior
  historial.slice(-3).forEach(h=>{
    let ht=norm(h);
    for(let k in TEMAS){
      if(TEMAS[k].p.some(p=>ht.includes(p))){
        let ex=encontrados.find(e=>e.tema===k);
        if(ex) ex.score+=2; else encontrados.push({tema:k,score:2});
      }
    }
  });
  encontrados.sort((a,b)=>b.score-a.score);
  return encontrados.map(e=>e.tema);
}
function versiculoPorRef(refBuscado){
  let m=refBuscado.match(/(.+?)\s*(\d+):(\d+)/);
  if(!m) return null;
  let lt=norm(m[1]), cap=+m[2], ver=+m[3];
  return todosLosVersiculos.find(v=> norm(v.book).includes(lt) && v.chapter===cap && v.verse===ver);
}

function pedirIA(){
  let consulta=document.getElementById('consultaIA').value.trim();
  if(!consulta) return;
  if(todosLosVersiculos.length===0){alert('Descargá primero la Biblia');return}
  historial.push(consulta);
  if(historial.length>10) historial=historial.slice(-10);
  localStorage.setItem('chatMax',JSON.stringify(historial));
  agregarChat('user',consulta);
  document.getElementById('consultaIA').value='';

  let temas=detectarTemas(consulta);
  let refs=[];
  temas.forEach(t=>{ TEMAS[t].vers.forEach(r=>{ if(!refs.includes(r)) refs.push(r); })});
  if(refs.length===0) refs=['Juan 3:16','Salmos 23:1','Filipenses 4:13'];

  let seleccion=[];
  for(let r of refs){
    let v=versiculoPorRef(r);
    if(v &&!seleccion.find(s=>s.ref===v.ref)) seleccion.push(v);
    if(seleccion.length>=3) break;
  }
  // SI NO ENCONTRÓ POR REF, BUSCA POR PALABRAS DEL TEMA (garantiza que siempre manda algo)
  if(seleccion.length<3 && temas.length>0){
    let palabras=TEMAS[temas[0]].p;
    for(let v of todosLosVersiculos){
      if(seleccion.length>=3) break;
      if(palabras.some(p=>v.texto.toLowerCase().includes(p)) &&!seleccion.find(s=>s.ref===v.ref)) seleccion.push(v);
    }
  }
  if(seleccion.length===0) seleccion=todosLosVersiculos.filter(v=>v.book==='Juan').slice(0,3);

  let textoIA = temas.length>0? `Veo que estás pasando por un momento de ${temas.join(', ')}. Te dejo esto de la Palabra:` : `Te dejo estos versículos para vos:`;
  agregarChat('ia', textoIA, seleccion);
}
function agregarChat(quien, texto, versiculos){
  let chat=document.getElementById('chatIA');
  let div=document.createElement('div');
  div.className='msg '+quien;
  div.textContent=texto;
  chat.appendChild(div);
  if(versiculos){
    versiculos.forEach(v=>{
      let card=document.createElement('div');
      card.className='msg ia';
      card.innerHTML=`<b>${v.ref}</b><br>"${v.texto}"<br><button style="margin-top:6px;padding:8px;border-radius:8px;border:none;background:#f5d76e;width:100%" onclick="hablarSuave('${v.texto.replace(/'/g,"")}','${v.ref}')">🔊 Escuchar</button>`;
      chat.appendChild(card);
    });
  }
  chat.scrollTop=chat.scrollHeight;
}
