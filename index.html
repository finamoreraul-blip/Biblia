<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia PRO Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0b;color:#e8e0c9;font-family:Georgia,serif}
header{position:sticky;top:0;background:#111;border-bottom:1px solid #2a2a2a;padding:12px;z-index:10;text-align:center}
header h1{color:#f5d76e;font-size:19px}
.menu{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.menu button{padding:9px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:13px;cursor:pointer}
.menu button.active{background:#f5d76e;color:#111;font-weight:800;border-color:#f5d76e}
.seccion{display:none;max-width:700px;margin:0 auto;padding:14px}
.seccion.activa{display:block}
#libro{background:#121210;border-radius:16px;padding:18px;min-height:60vh}
.titulo-libro{text-align:center;color:#f5d76e;font-size:22px;border-bottom:1px solid #333;padding-bottom:10px;margin-bottom:12px}
.cap-num{font-size:46px;float:left;line-height:.9;margin:6px 10px 2px 0;color:#f5d76e;font-weight:800}
.texto{font-size:18px;line-height:2;text-align:justify}
.vers{cursor:pointer;border-radius:6px;padding:2px}
.vers:hover{background:#222}
.num{font-size:11px;color:#f5d76e;font-weight:800;vertical-align:super}
.resaltado{background:#4a3f15}
.nav{display:flex;gap:8px;margin-top:20px}
.nav button{flex:1;padding:13px;border-radius:99px;border:1px solid #f5d76e;background:transparent;color:#f5d76e;font-weight:800;cursor:pointer}
input,textarea,select{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#1e1e1e;color:#fff;margin-top:8px;font-size:15px}
button.grande{width:100%;margin-top:10px;padding:14px;border-radius:10px;border:none;background:#f5d76e;color:#111;font-weight:800;cursor:pointer}
.card{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:14px;margin-top:12px}
.card small{color:#f5d76e;font-weight:800}
.card p{margin-top:6px;line-height:1.6}
.card button{margin-top:8px;padding:10px;border-radius:99px;border:none;background:#f5d76e;font-weight:700;width:100%;cursor:pointer}
#modal{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:2px solid #f5d76e;padding:16px;display:none;z-index:20;max-width:700px;margin:0 auto}
#modal button{display:block;width:100%;margin-top:8px;padding:12px;border-radius:10px;border:none;background:#f5d76e;font-weight:800;cursor:pointer}
#modal button.sec{background:#333;color:#fff}
</style>
</head>
<body>
<header>
<h1>📖 BIBLIA PRO FINAL</h1>
<div class="menu">
<button class="active" onclick="mostrar('leer')">📖 Leer</button>
<button onclick="mostrar('ia')">🤖 IA</button>
<button onclick="mostrar('fav')">⭐ Favoritos</button>
</div>
</header>

<!-- LEER -->
<div id="sec-leer" class="seccion activa">
<input id="buscarInput" placeholder="Buscar cita: Juan 3:16">
<button class="grande" onclick="buscarCita()">🔍 BUSCAR EN TODA LA BIBLIA</button>
<select id="libroSel" onchange="cargarCaps()"></select>
<select id="capSel" onchange="cargarCap()"></select>
<div style="display:flex;gap:8px;margin-top:8px">
<button style="flex:1;padding:10px;border-radius:10px;border:1px solid #444;background:#1a1a1a;color:#fff" onclick="cambiarLetra(1)">A+ Grande</button>
<button style="flex:1;padding:10px;border-radius:10px;border:1px solid #444;background:#1a1a1a;color:#fff" onclick="cambiarLetra(-1)">A- Chica</button>
<button style="flex:1;padding:10px;border-radius:10px;border:1px solid #444;background:#1a1a1a;color:#fff" onclick="verDelDia()">✨ Del Día</button>
</div>
<div id="libro" style="margin-top:12px"><p style="text-align:center;color:#888;padding:20px">Cargando...</p></div>
</div>

<!-- IA -->
<div id="sec-ia" class="seccion">
<div class="card">
<small>🔑 TU CLAVE GEMINI (gratis, se guarda solo en tu celu)</small>
<input id="iaKey" type="password" placeholder="Pegá tu clave AI Studio acá">
<small style="margin-top:6px;display:block">¿No tenés? Andá aistudio.google.com/apikey - 1 minuto y es gratis</small>
</div>
<div class="card">
<small>🤖 CONTAME CÓMO ESTÁS</small>
<textarea id="consultaIA" rows="3" placeholder="Ej: estoy con problemas económicos, no sé qué hacer..."></textarea>
<button class="grande" onclick="pedirIA()">PEDIR A LA IA</button>
<div id="resultadoIA"></div>
</div>
</div>

<!-- FAV -->
<div id="sec-fav" class="seccion">
<h2 style="color:#f5d76e;margin-bottom:10px">⭐ Mis Favoritos y Resaltados</h2>
<div id="listaFav"></div>
</div>

<div id="modal">
<h3 id="modalRef" style="color:#f5d76e"></h3>
<p id="modalTexto" style="margin-top:8px;line-height:1.6"></p>
<button onclick="accionFav()">⭐ Guardar en Favoritos</button>
<button class="sec" onclick="accionResaltar()">🖍 Resaltar / Quitar</button>
<button class="sec" onclick="accionEscuchar()">🔊 Escuchar</button>
<button class="sec" onclick="accionCompartir()">💬 Compartir</button>
<button class="sec" style="background:#a00;color:#fff" onclick="cerrarModal()">Cerrar</button>
</div>

<script>
const LIBROS = [
["Génesis","GEN",50],["Éxodo","EXO",40],["Levítico","LEV",27],["Números","NUM",36],["Deuteronomio","DEU",34],
["Josué","JOS",24],["Jueces","JDG",21],["Rut","RUT",4],["1 Samuel","1SA",31],["2 Samuel","2SA",24],
["1 Reyes","1KI",22],["2 Reyes","2KI",25],["1 Crónicas","1CH",29],["2 Crónicas","2CH",36],["Esdras","EZR",10],
["Nehemías","NEH",13],["Ester","EST",10],["Job","JOB",42],["Salmos","PSA",150],["Proverbios","PRO",31],
["Eclesiastés","ECC",12],["Cantares","SNG",8],["Isaías","ISA",66],["Jeremías","JER",52],["Lamentaciones","LAM",5],
["Ezequiel","EZK",48],["Daniel","DAN",12],["Oseas","HOS",14],["Joel","JOL",3],["Amós","AMO",9],
["Abdías","OBA",1],["Jonás","JON",4],["Miqueas","MIC",7],["Nahum","NAM",3],["Habacuc","HAB",3],
["Sofonías","ZEP",3],["Hageo","HAG",2],["Zacarías","ZEC",14],["Malaquías","MAL",4],["Mateo","MAT",28],
["Marcos","MRK",16],["Lucas","LUK",24],["Juan","JHN",21],["Hechos","ACT",28],["Romanos","ROM",16],
["1 Corintios","1CO",16],["2 Corintios","2CO",13],["Gálatas","GAL",6],["Efesios","EPH",6],["Filipenses","PHP",4],
["Colosenses","COL",4],["1 Tesalonicenses","1TH",5],["2 Tesalonicenses","2TH",3],["1 Timoteo","1TI",6],
["2 Timoteo","2TI",4],["Tito","TIT",3],["Filemón","PHM",1],["Hebreos","HEB",13],["Santiago","JAS",5],
["1 Pedro","1PE",5],["2 Pedro","2PE",5],["1 Juan","1JN",5],["2 Juan","2JN",1],["3 Juan","3JN",1],
["Judas","JUD",1],["Apocalipsis","REV",22]
];
const VERS_LOCAL = [
{ref:"Filipenses 4:19",texto:"Y mi Dios suplirá todo lo que os falta conforme a sus riquezas en gloria en Cristo Jesús.",tema:"ECONOMIA"},
{ref:"Mateo 6:33",texto:"Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas.",tema:"ECONOMIA"},
{ref:"Salmos 23:1",texto:"Jehová es mi pastor; nada me faltará.",tema:"PAZ"},
{ref:"Juan 3:16",texto:"Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.",tema:"AMOR"},
{ref:"Filipenses 4:6-7",texto:"Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias.",tema:"ANSIEDAD"},
{ref:"Salmos 34:18",texto:"Cercano está Jehová a los quebrantados de corazón, y salva a los contritos de espíritu.",tema:"TRISTEZA"},
{ref:"Isaías 41:10",texto:"No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios que te esfuerzo.",tema:"MIEDO"},
{ref:"Proverbios 3:5",texto:"Fíate de Jehová de todo tu corazón, y no te apoyes en tu propia prudencia.",tema:"CONFIANZA"},
{ref:"Jeremías 29:11",texto:"Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis.",tema:"ESPERANZA"}
];

let libroSel=document.getElementById('libroSel'), capSel=document.getElementById('capSel');
let favs=JSON.parse(localStorage.getItem('favFinal')||'[]');
let resaltados=new Set(JSON.parse(localStorage.getItem('resFinal')||'[]'));
let currentVerses=[];
let seleccionado=null;
let tamLetra=18;
let iaKeyInput=document.getElementById('iaKey');
iaKeyInput.value=localStorage.getItem('miGeminiKey')||'';
iaKeyInput.addEventListener('change',e=>localStorage.setItem('miGeminiKey',e.target.value.trim()));

LIBROS.forEach((l,i)=>{let o=document.createElement('option');o.value=i;o.textContent=l[0];libroSel.appendChild(o)});
cargarCaps();

document.getElementById('libro').addEventListener('click',e=>{
  let el=e.target.closest('.vers');
  if(el){abrirModal(+el.dataset.i)}
});

function mostrar(v){
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.seccion').forEach(s=>s.classList.remove('activa'));
  document.getElementById('sec-'+v).classList.add('activa');
  if(v==='fav') renderFav();
}

async function cargarCaps(){
  let total=LIBROS[libroSel.value][2];
  capSel.innerHTML='';
  for(let c=1;c<=total;c++){let o=document.createElement('option');o.value=c;o.textContent='Capítulo '+c;capSel.appendChild(o)}
  await cargarCap();
}

async function cargarCap(){
  let idx=+libroSel.value, cap=+capSel.value;
  let [nombre,codigo]=[LIBROS[idx][0],LIBROS[idx][1]];
  let cont=document.getElementById('libro');
  cont.innerHTML='<p style="text-align:center;color:#888;padding:20px">Abriendo '+nombre+' '+cap+'...</p>';
  try{
    let r=await fetch(`https://bolls.life/get-text/${codigo}/${cap}/?translation=rvr1960`);
    if(!r.ok) throw new Error('api');
    let data=await r.json();
    currentVerses=data.map(v=>({num:v.verse, ref:`${nombre} ${cap}:${v.verse}`, texto:(v.text||'').replace(/<[^>]*>/g,'')}));
    let html=`<div class="titulo-libro">${nombre} ${cap}</div><div class="texto" style="font-size:${tamLetra}px"><span class="cap-num">${cap}</span>`;
    currentVerses.forEach((v,i)=>{
      let isRes=resaltados.has(v.ref)?' resaltado':'';
      html+=`<span class="vers${isRes}" data-i="${i}"><span class="num">${v.num}</span> ${v.texto} </span>`;
    });
    html+=`</div><div class="nav"><button onclick="cambiarCap(-1)">← Anterior</button><button onclick="leerCapitulo()">🔊 Escuchar</button><button onclick="cambiarCap(1)">Siguiente →</button></div>`;
    cont.innerHTML=html;
  }catch(e){
    cont.innerHTML='<p style="text-align:center;color:#f5d76e;padding:20px">No cargó internet.<br>Revisá tu conexión y tocá de nuevo el capítulo.</p>';
  }
}

function cambiarCap(d){
  let idx=+libroSel.value, cap=+capSel.value, total=LIBROS[idx][2];
  let nuevo=cap+d;
  if(nuevo<1){ if(idx>0){libroSel.value=idx-1;cargarCaps().then(()=>{capSel.value=LIBROS[idx-1][2];cargarCap()});} return; }
  if(nuevo>total){ if(idx<LIBROS.length-1){libroSel.value=idx+1;cargarCaps().then(()=>{capSel.value=1;cargarCap()});} return; }
  capSel.value=nuevo; cargarCap();
}

async function buscarCita(){
  let raw=document.getElementById('buscarInput').value.trim(); if(!raw){alert('Escribí una cita');return}
  let m=raw.match(/(.+?)\s*(\d+):(\d+)/);
  if(!m){alert('Formato: Juan 3:16');return}
  let libroTxt=m[1].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  let idx=LIBROS.findIndex(l=>l[0].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(libroTxt));
  if(idx<0){alert('Libro no encontrado');return}
  libroSel.value=idx; await cargarCaps(); capSel.value=m[2]; await cargarCap();
  setTimeout(()=>{
    document.querySelectorAll('.num').forEach(n=>{if(n.textContent===m[3]){n.parentElement.style.background='#3a3320';n.parentElement.scrollIntoView({behavior:'smooth',block:'center'})}});
  },700);
}

function abrirModal(i){
  seleccionado=currentVerses[i];
  document.getElementById('modalRef').textContent=seleccionado.ref;
  document.getElementById('modalTexto').textContent='"'+seleccionado.texto+'"';
  document.getElementById('modal').style.display='block';
}
function cerrarModal(){document.getElementById('modal').style.display='none'}
function accionFav(){
  if(!favs.find(f=>f.ref===seleccionado.ref)){favs.push(seleccionado);localStorage.setItem('favFinal',JSON.stringify(favs));alert('⭐ Guardado en Favoritos')}
  cerrarModal();
}
function accionResaltar(){
  if(resaltados.has(seleccionado.ref)) resaltados.delete(seleccionado.ref); else resaltados.add(seleccionado.ref);
  localStorage.setItem('resFinal',JSON.stringify([...resaltados]));
  cargarCap(); cerrarModal();
}
function accionEscuchar(){
  hablarSuave(seleccionado.texto, seleccionado.ref); cerrarModal();
}
function accionCompartir(){
  window.open('https://wa.me/?text='+encodeURIComponent(seleccionado.ref+': '+seleccionado.texto),'_blank'); cerrarModal();
}
function hablarSuave(texto, ref){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(ref+'. '+texto); u.lang='es-AR'; u.rate=0.85; u.pitch=0.9; speechSynthesis.speak(u);
}
function leerCapitulo(){
  let t=document.getElementById('libro').innerText;
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t); u.lang='es-AR'; u.rate=0.9; u.pitch=0.9; speechSynthesis.speak(u);
}
function cambiarLetra(d){tamLetra=Math.min(24,Math.max(14,tamLetra+d));cargarCap()}
function renderFav(){
  let c=document.getElementById('listaFav');
  if(favs.length===0){c.innerHTML='<p style="color:#888">No tenés favoritos todavía. Tocá un versículo y guardalo.</p>';return}
  c.innerHTML=favs.map((f,i)=>`<div class="card"><small>${f.ref}</small><p>"${f.texto}"</p><button onclick="borrarFav(${i})" style="background:#a00;color:#fff">Borrar</button><button onclick="hablarSuave('${f.texto.replace(/'/g,"")}','${f.ref}')">🔊 Escuchar</button></div>`).join('');
}
function borrarFav(i){favs.splice(i,1);localStorage.setItem('favFinal',JSON.stringify(favs));renderFav()}

async function pedirIA(){
  let consulta=document.getElementById('consultaIA').value.trim();
  let key=iaKeyInput.value.trim();
  let out=document.getElementById('resultadoIA');
  if(!consulta){alert('Escribime cómo te sentís');return}
  out.innerHTML='<p style="color:#f5d76e;margin-top:10px">🤖 Pensando...</p>';
  let prompt=`Actúa como pastor. Persona dice: "${consulta}". Recomienda 3 versículos Reina Valera. Devuelve SOLO JSON array: [{"ref":"Juan 3:16","texto":"...","tema":"ESPERANZA"}]`;
  if(!key){
    out.innerHTML='<p style="color:#f5d76e;margin-top:10px">Modo offline (sin clave):</p>'+iaLocal(consulta);
    return;
  }
  try{
    let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
    if(!r.ok) throw new Error('key mala');
    let data=await r.json();
    let texto=data?.candidates?.[0]?.content?.parts?.[0]?.text||'[]';
    texto=texto.replace(/```json/g,'').replace(/```/g,'').trim();
    let vers=JSON.parse(texto);
    out.innerHTML=vers.map(v=>`<div class="card"><small>${v.tema}</small><p><b>${v.ref}</b>: "${v.texto}"</p><button onclick="hablarSuave('${v.texto.replace(/'/g,"")}','${v.ref}')">🔊 Escuchar</button></div>`).join('');
  }catch(e){
    out.innerHTML='<p style="color:#f5d76e;margin-top:10px">IA de Google no respondió (revisá la clave o internet). Te dejo esta selección:</p>'+iaLocal(consulta);
  }
}
function iaLocal(consulta){
  let c=consulta.toLowerCase();
  let filtrados=VERS_LOCAL.filter(v=> c.includes('plata')||c.includes('econom')||c.includes('deuda')? v.tema==='ECONOMIA' : c.includes('miedo')||c.includes('temor')? v.tema==='MIEDO' : c.includes('triste')||c.includes('mal')? v.tema==='TRISTEZA' : c.includes('ansie')||c.includes('nerv')? v.tema==='ANSIEDAD' : true);
  if(filtrados.length===0) filtrados=VERS_LOCAL.slice(0,3);
  return filtrados.slice(0,3).map(v=>`<div class="card"><small>${v.tema}</small><p><b>${v.ref}</b>: "${v.texto}"</p><button onclick="hablarSuave('${v.texto.replace(/'/g,"")}','${v.ref}')">🔊 Escuchar</button></div>`).join('');
}
function verDelDia(){
  let e=VERS_LOCAL[new Date().getDate()%VERS_LOCAL.length];
  alert('✨ Versículo del día\n'+e.ref+'\n"'+e.texto+'"');
}
</script>
</body>
</html>
